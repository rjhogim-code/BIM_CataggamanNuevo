<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>resident.html</title>
<style>
:root{--pink:#db2777;--pale:#fdf2f8;--ink:#302831;--muted:#796f77;--line:#eee4e9}*{box-sizing:border-box}body{margin:0;background:#faf8f9;color:var(--ink);font:15px/1.5 system-ui, sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1200px;margin:30px auto;padding:0 18px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.btn{padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-weight:650}.primary{background:var(--pink);color:#fff;border-color:var(--pink)}.panel{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:0 6px 22px #4320340a;padding:18px}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input, .toolbar select, .field input, .field select{padding:9px 10px;border:1px solid #e7dce3;border-radius:8px;background:white;min-width:0}.toolbar input{flex:1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px;border-bottom:1px solid #f0eaee;font-size:13px}th{font-size:11px;color:var(--muted);text-transform:uppercase}.danger{color:#b4234c}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:700}.full{grid-column:1/-1}.empty{text-align:center;color:#90858d;padding:26px}.dialog{display:none}.modal{position:fixed;inset:0;background:rgba(33,16,27,.4);display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-card{background:#fff;border-radius:14px;padding:22px;width:min(580px,100%);box-shadow:0 20px 70px #21101b44}.dialog-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.dialog-title h3{margin:0}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.hidden{display:none}</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div><h2 style="margin:0">Resident Records</h2><small style="color:var(--muted)">Separate resident management page</small></div>
    <button class="btn primary" id="newResident">＋ Add New Resident</button>
  </div>
  <div class="panel">
    <div class="toolbar">
      <input id="residentSearch" placeholder="Search name, address, or zone…">
      <select id="residentGender"><option value="">All genders</option><option>Female</option><option>Male</option><option>Other</option></select>
    </div>
    <div class="table-wrap">
      <table><thead><tr><th>Full name</th><th>Age</th><th>Gender</th><th>Civil status</th><th>Address / Zone</th><th>Contact</th><th>Voter</th><th>Actions</th></tr></thead><tbody id="residentRows"></tbody></table>
    </div>
  </div>
</div>
<div class="modal" id="recordModal">
  <div class="modal-card">
    <form id="recordForm">
      <div class="dialog-title"><h3 id="dialogTitle">Add resident</h3><button type="button" class="btn" id="closeDialog">✕</button></div>
      <div class="form-grid">
        <div class="field full"><label>Full name *</label><input name="name" required></div>
        <div class="field"><label>Age</label><input name="age" type="number" min="0" max="125"></div>
        <div class="field"><label>Gender</label><select name="gender"><option>Female</option><option>Male</option><option>Other</option></select></div>
        <div class="field"><label>Civil status</label><select name="civil"><option>Single</option><option>Married</option><option>Widowed</option><option>Separated</option></select></div>
        <div class="field"><label>Voter status</label><select name="voter"><option>Registered</option><option>Not registered</option></select></div>
        <div class="field"><label>Address / Zone</label><input name="address"></div>
        <div class="field"><label>Contact number</label><input name="contact" type="tel"></div>
      </div>
      <div class="form-actions"><button type="button" class="btn" id="cancelDialog">Cancel</button><button type="submit" class="btn primary">Save record</button></div>
    </form>
  </div>
</div>
<script>
(() => {
  const storageKey='cataggaman_residents';
  const read=()=>{try{return JSON.parse(localStorage.getItem(storageKey)||'[]')}catch{return[]}};
  const save=v=>localStorage.setItem(storageKey,JSON.stringify(v));
  const escape=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
  const modal=document.querySelector('#recordModal');
  const form=document.querySelector('#recordForm');
  let editId=null;

  function openResidentDialog(item){
    editId=item?.id||null;
    form.reset();
    document.querySelector('#dialogTitle').textContent=editId?'Edit resident':'Add resident';
    if(item) Object.entries(item).forEach(([key,val]) => { const x=form.elements.namedItem(key); if(x) x.value=val; });
    modal.classList.add('show');
  }

  function renderResidents(){
    const q=document.querySelector('#residentSearch').value.toLowerCase();
    const g=document.querySelector('#residentGender').value;
    const list=read().filter(r => (!g || r.gender===g) && Object.values(r).some(v => String(v).toLowerCase().includes(q)));
    document.querySelector('#residentRows').innerHTML=list.map(r=>`<tr><td><b>${escape(r.name)}</b></td><td>${escape(r.age||'—')}</td><td>${escape(r.gender||'—')}</td><td>${escape(r.civil||'—')}</td><td>${escape(r.address||'—')}</td><td>${escape(r.contact||'—')}</td><td>${escape(r.voter||'—')}</td><td><button class="btn" data-edit="${escape(r.id)}">Edit</button> <button class="btn danger" data-del="${escape(r.id)}">Delete</button></td></tr>`).join('')||'<tr><td class="empty" colspan="8">No residents found.</td></tr>';
  }

  document.querySelector('#newResident').onclick=()=>openResidentDialog();
  document.querySelector('#closeDialog').onclick=document.querySelector('#cancelDialog').onclick=()=>modal.classList.remove('show');
  form.onsubmit=e=>{
    e.preventDefault();
    const data=Object.fromEntries(new FormData(form));
    const list=read();
    if(editId){
      const i=list.findIndex(x=>x.id===editId);
      if(i>=0) list[i]={...list[i],...data};
    } else {
      list.unshift({id:crypto.randomUUID?.()||String(Date.now()),...data,createdAt:new Date().toISOString()});
    }
    save(list);
    modal.classList.remove('show');
    renderResidents();
  };

  document.addEventListener('click',e=>{
    const btn=e.target.closest('button');
    if(!btn) return;
    if(btn.dataset.edit){
      const item=read().find(x=>x.id===btn.dataset.edit); if(item) openResidentDialog(item); return;
    }
    if(btn.dataset.del){
      if(confirm('Delete this resident record?')){
        save(read().filter(x=>x.id!==btn.dataset.del));
        renderResidents();
      }
    }
  });

  ['residentSearch','residentGender'].forEach(id => document.querySelector('#'+id).addEventListener('input', renderResidents));
  renderResidents();
})();
</script>
</body>
</html>`;
